<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alzheimer's Analytics Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css" />
</head>
<body>
<div id="root">Loading dashboard (first load takes ~30-60 s)...</div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js";
mount({
  requirements: ["pandas", "plotly", "scikit-learn"],
  entrypoint: "alz_dashboard.py",
  files: {
    "alz_dashboard.py": { url: "./alz_dashboard.py" },
    "alzheimers_disease_data.csv": { url: "./alzheimers_disease_data.csv" }
  }
}, document.getElementById("root"));
</script>
</body>
</html>
